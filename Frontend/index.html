<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Seu painel financeiro pessoal: contas, transações, dívidas, orçamento, metas e investimentos." />
    <!-- FIN-082: PWA instalável — manifesto, cor da barra do sistema e ícone da tela inicial do iOS. -->
    <meta name="theme-color" content="#f2f4f7" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- FIN-083: aplica o tema salvo antes da primeira pintura, para o tema claro não piscar antes
         do escuro. Mesma regra de resolveTheme (src/utils/theme.ts) — um teste confere os dois. -->
    <script>
      try {
        var pref = localStorage.getItem('finflow_theme');
        var dark = pref === 'dark' || (pref === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (dark && meta) meta.setAttribute('content', '#000000');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <title>FinFlow - Dashboard Financeiro</title>
    <script src="https://cdn.pluggy.ai/pluggy-connect/v2.8.2/pluggy-connect.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
